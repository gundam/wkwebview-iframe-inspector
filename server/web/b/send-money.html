<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PayPal Checkout Amount</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b4d;
      background: linear-gradient(150deg, #f7fbff, #eef7ff);
    }
    .eyebrow { margin: 0 0 9px; color: #0070ba; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    h2 { margin: 0 0 6px; color: #003087; font-size: 22px; }
    .notice { margin: 0 0 22px; color: #52667a; line-height: 1.4; }
    label { display: block; margin-bottom: 7px; color: #243b53; font-size: 13px; font-weight: 750; }
    .amount-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      overflow: hidden;
      border: 2px solid #8ec8f0;
      border-radius: 13px;
      background: #ffffff;
    }
    .currency { padding-left: 14px; color: #52667a; font-weight: 800; }
    input {
      width: 100%;
      min-height: 54px;
      padding: 11px 14px 11px 9px;
      border: 0;
      color: #102a43;
      background: transparent;
      font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      outline: none;
    }
    .amount-field:focus-within { border-color: #0070ba; box-shadow: 0 0 0 4px rgba(0, 112, 186, .12); }
    #amount-preview { margin: 13px 0 0; color: #0070ba; font-weight: 700; }
    [data-native-summary] { display: none; }
  </style>
</head>
<body data-page-owner="paypalweb-checkout">
  <p class="eyebrow">PAYPAL · CHECKOUT PAGE</p>
  <h2>This is a PayPal Checkout page</h2>
  <p class="notice">It is loaded inside the Samsung webpage as a cross-origin iframe.</p>

  <label for="amount">Amount to send</label>
  <div class="amount-field">
    <span class="currency">USD</span>
    <input id="amount" name="amount" type="number" min="0.01" step="0.01" value="125.00" inputmode="decimal">
  </div>
  <p id="amount-preview" aria-live="polite">Demo amount: USD 125.00</p>
  <span id="native-summary" data-native-summary>PayPal Checkout · Amount USD 125.00</span>

  <script>
    (() => {
      const amount = document.querySelector('#amount');
      const preview = document.querySelector('#amount-preview');
      const summary = document.querySelector('#native-summary');

      const updateAmount = () => {
        const value = Number(amount.value);
        const formatted = Number.isFinite(value) ? value.toFixed(2) : '0.00';
        preview.textContent = `Demo amount: USD ${formatted}`;
        summary.textContent = `PayPal Checkout · Amount USD ${formatted}`;
      };

      amount.addEventListener('input', updateAmount);
    })();
  </script>
</body>
</html>
