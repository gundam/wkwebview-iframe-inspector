<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paypalweb Balance</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172554;
      background: linear-gradient(145deg, #eff6ff, #eef2ff);
    }
    .eyebrow { margin: 0 0 8px; color: #2563eb; font-size: 12px; font-weight: 800; letter-spacing: .09em; }
    h2 { margin: 0; font-size: 19px; }
    .account { margin: 4px 0 18px; color: #64748b; font-size: 13px; }
    .amount { margin: 0; color: #0f172a; font-size: 36px; font-weight: 800; letter-spacing: -.04em; }
    .available { margin: 5px 0 18px; color: #475569; }
    .available strong { color: #047857; }
    [data-native-summary] { display: none; }
  </style>
</head>
<body data-page-owner="paypalweb-balance">
  <p class="eyebrow">PAYPAL · BALANCE PAGE</p>
  <h2>This is a PayPal balance page</h2>
  <p class="account" id="render-context">Loaded inside the Samsung webpage as an iframe</p>
  <h2>Available balance</h2>
  <p class="account">Personal account ···· 4821</p>
  <p class="amount" id="current-balance">$12,480.50</p>
  <p class="available">Available now: <strong id="available-balance">$12,350.50</strong></p>

  <span id="native-summary" data-native-summary>PayPal balance iframe · Balance $12,480.50 · Available $12,350.50</span>

  <script>
    if (window.self === window.top) {
      document.title = 'PayPal Balance in Safari';
      document.getElementById('render-context').textContent = 'Opened directly in SFSafariViewController';
      document.getElementById('native-summary').textContent =
        'PayPal balance page · Safari browser view · Balance $12,480.50 · Available $12,350.50';
    }
  </script>
</body>
</html>
