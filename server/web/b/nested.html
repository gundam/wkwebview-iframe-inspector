<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paypalweb Nested Frame</title>
  <style>
    body { font: 15px -apple-system, sans-serif; margin: 16px; background: #eff6ff; color: #172554; }
    input { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #60a5fa; border-radius: 8px; }
    iframe { box-sizing: border-box; width: 100%; height: 235px; margin-top: 14px; border: 3px solid #059669; border-radius: 10px; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Level 1 · Paypalweb</h2>
  <p>Origin: <code>https://paypalweb.localhost:8443</code></p>
  <input id="level-one-value" name="levelOneValue" value="Value from depth 1">
  <iframe
    title="Checkoutweb level 2 frame"
    src="https://checkoutweb.localhost:8443/deep.html">
  </iframe>
</body>
</html>
