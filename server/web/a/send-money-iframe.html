<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Samsungweb Send Money iframe</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px -apple-system, sans-serif; margin: 18px; color: #182230; background: #f8fafc; }
    h1 { margin-bottom: 6px; font-size: 26px; }
    .intro { margin: 0 0 18px; color: #64748b; }
    .frame-label { display: flex; justify-content: space-between; margin: 16px 2px 7px; font-size: 13px; font-weight: 800; }
    .frame-label code { color: #0f766e; font-weight: 600; }
    iframe { width: 100%; height: 475px; border: 2px solid #14b8a6; border-radius: 15px; background: white; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
    [data-native-summary] { display: none; }
  </style>
</head>
<body>
  <h1>Send Money iframe</h1>
  <p class="intro">A Checkoutweb transfer form loaded as one cross-origin iframe.</p>

  <div class="frame-label"><span>Demo transfer</span><code>checkoutweb.localhost</code></div>
  <iframe
    id="send-frame"
    title="Checkoutweb send money frame"
    src="https://checkoutweb.localhost:8443/send-money.html">
  </iframe>

  <span data-native-summary>Send Money iframe · Checkoutweb demo transfer</span>

  <script>
    (() => {
      const sendOrigin = 'https://checkoutweb.localhost:8443';
      const sendFrame = document.querySelector('#send-frame');

      window.addEventListener('message', (event) => {
        if (event.origin !== sendOrigin || event.source !== sendFrame.contentWindow) return;
        if (event.data?.type !== 'demo-transfer') return;

        sendFrame.contentWindow.postMessage({
          type: 'demo-transfer-complete',
          reference: `DEMO-${Date.now().toString().slice(-6)}`
        }, sendOrigin);
      });
    })();
  </script>
</body>
</html>
