<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Samsungweb Input Test</title>
  <style>
    body { font: 16px -apple-system, sans-serif; margin: 24px; color: #182230; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #8ea0b5; border-radius: 10px; font: inherit; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 99px; color: #075985; background: #e0f2fe; }
  </style>
</head>
<body>
  <span class="badge">Samsungweb · HTTPS</span>
  <h1>Direct Page</h1>
  <p>Edit a field and watch the native debug result update, or tap “Inspect” in the navigation bar.</p>
  <label for="username">Username</label>
  <input id="username" name="username" value="Initial value from the Samsungweb page" placeholder="Enter a username">
  <label for="memo">Notes</label>
  <textarea id="memo" name="memo">Native code can read this text as well.</textarea>
</body>
</html>
