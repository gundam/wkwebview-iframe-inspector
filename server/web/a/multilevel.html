<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Samsungweb Multi-Level Container</title>
  <style>
    body { font: 16px -apple-system, sans-serif; margin: 18px; color: #172033; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #64748b; border-radius: 9px; }
    iframe { box-sizing: border-box; width: 100%; height: 390px; margin-top: 16px; border: 3px solid #2563eb; border-radius: 12px; }
    code { color: #2563eb; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Level 0 · Samsungweb</h1>
  <p>Origin: <code>https://samsungweb.localhost:8443</code></p>
  <input id="level-zero-value" name="levelZeroValue" value="Value from depth 0">
  <iframe
    title="Paypalweb level 1 frame"
    src="https://paypalweb.localhost:8443/nested.html">
  </iframe>
</body>
</html>
