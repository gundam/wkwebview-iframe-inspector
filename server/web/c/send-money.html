<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkoutweb Send Money</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #052e2b;
      background: linear-gradient(145deg, #ecfdf5, #f0fdfa);
    }
    .eyebrow { margin: 0 0 8px; color: #0f766e; font-size: 12px; font-weight: 800; letter-spacing: .09em; }
    h2 { margin: 0 0 5px; font-size: 19px; }
    .notice { margin: 0 0 16px; color: #64748b; font-size: 13px; }
    label { display: block; margin: 11px 0 5px; color: #334155; font-size: 13px; font-weight: 700; }
    input, select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #5eead4;
      border-radius: 10px;
      background: rgba(255, 255, 255, .9);
      color: #0f172a;
      font: inherit;
    }
    .amount-row { display: grid; grid-template-columns: minmax(0, 1fr) 86px; gap: 9px; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: #0f766e;
      font: inherit;
      font-weight: 800;
    }
    #transfer-status { min-height: 20px; margin: 12px 0 0; color: #047857; font-weight: 700; }
    [data-native-summary] { display: none; }
  </style>
</head>
<body data-page-owner="checkoutweb-send-money">
  <p class="eyebrow">CHECKOUTWEB · DEMO TRANSFER</p>
  <h2>Send money</h2>
  <p class="notice">Local simulator demo. No real money will be moved.</p>

  <form id="send-form">
    <label for="recipient">Send to</label>
    <input id="recipient" name="recipient" type="email" value="alex@example.test" autocomplete="off">

    <label for="amount">Amount</label>
    <div class="amount-row">
      <input id="amount" name="amount" type="number" min="0.01" step="0.01" value="125.00">
      <select id="currency" name="currency" aria-label="Currency">
        <option selected>USD</option>
      </select>
    </div>

    <label for="memo">Note</label>
    <input id="memo" name="memo" value="Dinner reimbursement">
    <button type="submit">Send demo money</button>
  </form>

  <p id="transfer-status" role="status">Ready to send.</p>
  <span id="native-summary" data-native-summary>Ready to send · USD 125.00</span>

  <script>
    (() => {
      const parentOrigin = 'https://samsungweb.localhost:8443';
      const form = document.querySelector('#send-form');
      const recipient = document.querySelector('#recipient');
      const amount = document.querySelector('#amount');
      const status = document.querySelector('#transfer-status');
      const summary = document.querySelector('#native-summary');

      const updateDraft = () => {
        summary.textContent = `Draft · USD ${Number(amount.value || 0).toFixed(2)} · ${recipient.value || 'No recipient'}`;
      };
      form.addEventListener('input', updateDraft);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = Number(amount.value);
        if (!recipient.value || !Number.isFinite(value) || value <= 0) {
          status.textContent = 'Enter a demo recipient and a valid amount.';
          summary.textContent = 'Transfer validation failed';
          return;
        }

        status.textContent = `Sending USD ${value.toFixed(2)}…`;
        summary.textContent = `Sending · USD ${value.toFixed(2)} · ${recipient.value}`;
        parent.postMessage({
          type: 'demo-transfer',
          recipient: recipient.value,
          amount: value,
          currency: 'USD'
        }, parentOrigin);
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== parentOrigin || event.source !== parent) return;
        if (event.data?.type !== 'demo-balance-updated') return;
        status.textContent = `Demo transfer complete. Available: ${event.data.available}`;
        summary.textContent = `Sent · Available ${event.data.available}`;
      });
    })();
  </script>
</body>
</html>
